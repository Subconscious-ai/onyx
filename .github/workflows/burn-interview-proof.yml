name: Burn interview proof

on:
  pull_request:
    paths:
      - 'backend/onyx/server/query_and_chat/burn2/**'
      - 'scripts/subconscious/**'
      - 'docs/subconscious/executive-*.md'
      - '.github/workflows/burn-interview-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    # Approved exception: the public fork cannot use the private AWS runner group.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install the existing brief validator dependency
        # Same version as backend/requirements/default.txt; no app/model credentials.
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Prove timing, evidence validation and evaluation failure detection
        env:
          PYTHONPATH: backend:scripts/subconscious
        run: python -m unittest test_profile_context test_eval_interview test_structured_brief test_requested_tool test_research_startup
