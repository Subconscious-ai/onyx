name: Python Unit Tests
concurrency:
  group: Python-Unit-Tests-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter needs pull-requests:read to list PR files on private repos (no-op on public).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          filters: |
            python:
              - 'backend/**'
              - 'scripts/subconscious/**'
              - 'pyproject.toml'
              - '.github/workflows/pr-python-tests.yml'
              - '.github/actions/setup-python-and-install-dependencies/**'

  backend-check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # The public fork cannot use the private AWS runner group. Keep the same ARM tests.
    runs-on: ${{ fromJSON(github.repository == 'Subconscious-ai/onyx' && '["ubuntu-24.04-arm"]' || format('["runs-on","runner=4cpu-linux-arm64","run-id={0}-backend-check"]', github.run_id)) }}
    timeout-minutes: 10


    env:
      PYTHONPATH: ./backend
      REDIS_CLOUD_PYTEST_PASSWORD: ${{ secrets.REDIS_CLOUD_PYTEST_PASSWORD }}
      DISABLE_TELEMETRY: "true"
      # Unit expectations use metadata bundled with the locked LiteLLM package.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Unit tests run without a live backend; EE code paths that depend on
      # Redis/Vespa/etc are not available, so disable enforcement here.
      LICENSE_ENFORCEMENT_ENABLED: "false"

    steps:
    - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc
      if: github.repository != 'Subconscious-ai/onyx'

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup Python and Install Dependencies
      uses: ./.github/actions/setup-python-and-install-dependencies
      with:
        requirements: |
          backend/requirements/default.txt
          backend/requirements/dev.txt
          backend/requirements/model_server.txt
          backend/requirements/ee.txt

    - name: Run Tests
      shell: script -q -e -c "bash --noprofile --norc -eo pipefail {0}"
      run: |
        py.test -o junit_family=xunit2 -v -n auto backend/tests/unit
        PYTHONPATH=backend:scripts/subconscious python -m unittest test_brief_background test_brief_generations test_research_job_retry test_research_state_update
