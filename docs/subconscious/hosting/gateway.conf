# Durable transport. Native Onyx remains the authentication authority.
# Bind the host port to loopback behind the existing HTTPS server.
events { worker_connections 256; }
http {
  map_hash_bucket_size 128;
  access_log off;
  error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=login:1m rate=6r/m;
  # Only reviewed frontend origins can redeem native single-use voice tokens.
  map $http_origin $burn_voice_origin {
    default "";
    "https://onyx-executive-git-codex-1-executive-interviewer-subconcious.vercel.app" "https://onyx-executive-git-codex-1-executive-interviewer-subconcious.vercel.app";
    "https://onyx-executive-git-codex-9-beca-conversation-subconcious.vercel.app" "https://onyx-executive-git-codex-1-executive-interviewer-subconcious.vercel.app";
  }
  server {
    listen 8085;
    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    # Native Onyx recognizes JSON auth errors when rendering the login shell.
    error_page 403 = @preview_forbidden;
    location @preview_forbidden {
      default_type application/json;
      return 403 '{"detail":"Authentication required or preview access restricted"}';
    }

    # GPT Researcher has separate bearer authentication; no Onyx cookies cross.
    location /research-mcp/ {
      proxy_set_header Cookie "";
      proxy_pass http://research:3193/;
    }

    # Browser audio bypasses Vercel. Native Onyx validates token, expiry and user.
    # Alias origins are normalized to WEB_DOMAIN only after exact allowlisting.
    location ~ ^/voice/(transcribe|synthesize)/stream$ {
      if ($burn_voice_origin = "") { return 403; }
      proxy_set_header Origin $burn_voice_origin;
      proxy_set_header Cookie "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://api_server:8080;
    }

    location = /health { proxy_pass http://api_server:8080; }
    location = /auth/type { proxy_pass http://api_server:8080; }
    location = /auth/login {
      limit_req zone=login burst=4 nodelay;
      proxy_pass http://api_server:8080;
    }
    location = /auth/logout { proxy_pass http://api_server:8080; }
    location = /auth/refresh { proxy_pass http://api_server:8080; }
    # No public signup, password-reset, OAuth enrollment, or alternate auth path.
    location ~ ^/(auth|users)(/|$) { return 403; }
    location = /_preview_auth {
      internal;
      proxy_pass http://api_server:8080/me;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location / {
      auth_request /_preview_auth;
      proxy_pass http://api_server:8080;
    }
  }
}
